<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Valentine Proposal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="page">
    <div class="card">

      <div class="logo">❤</div>

      <h1 class="title"></h1>
      
      <div class="animation">
          <p class="question">Do you like me?</p>
      <p class="subtitle">Choose wisely...</p>

      </div>
      <div class="btn-group">
        <button id="yesBtn" class="btn yes">Yes</button>
        <button id="noBtn" class="btn no">No</button>
      </div>

      <p class="hint">Hint: The "No" button is shy.</p>

    </div>
  </div>

  <div class="floating-icons">
    <span>❤</span>
    <span>💖</span>
    <span>💘</span>
    <span>💕</span>
    <span>💖</span>
    <span>💘</span>
    <span>💕</span>
    <span>💓</span>
    <span>❤</span>
    <span>💖</span>
  </div>
 <audio id="sound" src="jump.mp3" preload="auto"></audio>
 <audio id="yes" src="yes.mp3" preload="auto"></audio>
  <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
   <script src="script.js"></script>
</body>
</html>
